<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Hábitos & Tareas</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --accent: #f59e0b;
            --success: #10b981;
            --radius: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 90px; max-width: 500px; margin: 0 auto; min-height: 100vh; }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 100;
            padding: 16px 20px; border-bottom: 1px solid var(--card-border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .stat-badge { background: #0f172a; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 0.9em; border: 1px solid var(--card-border); }
        .container { padding: 20px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { font-size: 1.2em; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
        .btn-add { background: var(--primary); color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85em; cursor: pointer; }

        .section-title { font-size: 0.9em; text-transform: uppercase; color: var(--text-muted); letter-spacing: 1px; margin: 16px 0 8px 0; }

        .task-card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .task-title { font-weight: 600; font-size: 1em; margin-bottom: 4px; }
        .task-meta { font-size: 0.8em; color: var(--text-muted); display: flex; gap: 8px; align-items: center; }
        .tag { background: rgba(99, 102, 241, 0.2); color: var(--primary-light); padding: 2px 6px; border-radius: 4px; font-weight: 600; }
        .tag-date { background: rgba(245, 158, 11, 0.2); color: var(--accent); }

        .checkbox-btn {
            width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--card-border);
            background: transparent; cursor: pointer; display: flex; align-items: center;
            justify-content: center; color: transparent; font-size: 1em; transition: all 0.2s;
        }

        .task-card.completed { opacity: 0.5; }
        .task-card.completed .task-title { text-decoration: line-through; }
        .task-card.completed .checkbox-btn { background: var(--success); border-color: var(--success); color: white; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-body { background: var(--card-bg); border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 24px; width: 100%; max-width: 500px; border-top: 1px solid var(--card-border); }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 0.85em; color: var(--text-muted); margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--card-border); background: var(--bg-color); color: var(--text-main); font-size: 1em; }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary); border: none; color: white; border-radius: 10px; font-weight: 700; font-size: 1em; margin-top: 10px; cursor: pointer; }

        nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 500px; margin: 0 auto; background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0 24px 0; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 0.75em; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: var(--primary-light); }
        .notif-box { background: #312e81; padding: 12px; border-radius: 12px; font-size: 0.85em; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <header>
        <div>
            <div style="font-size: 0.75em; color: var(--text-muted);">Estado</div>
            <div style="font-weight: 700;" id="today-pct">0% Completado</div>
        </div>
        <div style="display:flex; gap:10px;">
            <div class="stat-badge" style="color:#f97316;">🔥 <span id="streak">0</span></div>
            <div class="stat-badge" style="color:#38bdf8;">⚡ <span id="xp">0</span> XP</div>
        </div>
    </header>

    <div class="container">
        <div id="notif-btn" class="notif-box">
            <span>Permitir notificaciones de iOS</span>
            <button onclick="enableNotifications()" style="background:#4f46e5; border:none; color:white; padding:6px 10px; border-radius:6px;">Activar</button>
        </div>

        <div id="tab-tasks" class="tab-content active">
            <h2>
                Mis Tareas & Hábitos
                <button class="btn-add" onclick="openModal()">+ Nuevo</button>
            </h2>

            <div class="section-title">🔄 Hábitos Diarios</div>
            <div id="habits-list"></div>

            <div class="section-title" style="margin-top:24px;">📅 Eventos Puntuales</div>
            <div id="single-list"></div>
        </div>
    </div>

    <!-- Modal Form -->
    <div id="modal-task" class="modal">
        <div class="modal-body">
            <h3 style="margin-bottom:12px;">Crear Recordatorio</h3>
            
            <div class="form-group">
                <label>Tipo de Recordatorio</label>
                <select id="type-select" onchange="toggleType()">
                    <option value="habit">Hábito Diario (Ej. Dientes)</option>
                    <option value="single">Fecha Única (Ej. Matrícula Univ.)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Título</label>
                <input type="text" id="task-title" placeholder="Escribe aquí...">
            </div>

            <div class="form-group" id="date-group" style="display:none;">
                <label>Fecha de la cita</label>
                <input type="date" id="task-date">
            </div>

            <div class="form-group">
                <label>Hora de la notificación</label>
                <input type="time" id="task-time" value="14:00">
            </div>

            <div class="form-group">
                <label>Aviso Insistente</label>
                <select id="task-interval">
                    <option value="0">Un solo aviso</option>
                    <option value="15">Avisar cada 15 min hasta completar</option>
                    <option value="30">Avisar cada 30 min hasta completar</option>
                </select>
            </div>

            <button class="btn-submit" onclick="saveTask()">Guardar</button>
            <button class="btn-submit" style="background:transparent; border:1px solid var(--card-border); margin-top:6px;" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('habit_app_v2')) || {
            items: [
                { id: 1, type: 'habit', title: 'Lavarse los dientes', time: '14:00', date: '', interval: 15, completed: false },
                { id: 2, type: 'single', title: 'Matrícula Universidad', time: '10:00', date: '2026-08-15', interval: 30, completed: false }
            ],
            streak: 0, xp: 0
        };

        function save() {
            localStorage.setItem('habit_app_v2', JSON.stringify(state));
            render();
        }

        function toggleType() {
            const type = document.getElementById('type-select').value;
            document.getElementById('date-group').style.display = type === 'single' ? 'block' : 'none';
        }

        function openModal() { document.getElementById('modal-task').classList.add('active'); }
        function closeModal() { document.getElementById('modal-task').classList.remove('active'); }

        function enableNotifications() {
            if ('Notification' in window) {
                Notification.requestPermission().then(perm => {
                    if (perm === 'granted') {
                        document.getElementById('notif-btn').style.display = 'none';
                        new Notification("✅ Notificaciones activadas en tu iPhone");
                    }
                });
            }
        }

        // Motor de comprobación por minuto
        setInterval(() => {
            const now = new Date();
            const curTime = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            const curDate = now.toISOString().split('T')[0];

            state.items.forEach(item => {
                if (!item.completed) {
                    if (item.type === 'habit' && item.time === curTime) {
                        triggerNotif(item.title);
                    } else if (item.type === 'single' && item.date === curDate && item.time === curTime) {
                        triggerNotif(item.title);
                    }
                }
            });
        }, 10000);

        function triggerNotif(title) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification("⏰ ¡Recordatorio!", { body: title, requireInteraction: true });
            }
        }

        function toggleCheck(id) {
            const item = state.items.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                state.xp += item.completed ? 25 : -25;
                save();
            }
        }

        function saveTask() {
            const title = document.getElementById('task-title').value.trim();
            const type = document.getElementById('type-select').value;
            const time = document.getElementById('task-time').value;
            const date = document.getElementById('task-date').value;
            const interval = parseInt(document.getElementById('task-interval').value);

            if (!title) return alert('Pon un título');

            state.items.push({ id: Date.now(), type, title, time, date, interval, completed: false });
            closeModal();
            save();
        }

        function render() {
            document.getElementById('streak').innerText = state.streak;
            document.getElementById('xp').innerText = Math.max(0, state.xp);

            const habitsBox = document.getElementById('habits-list');
            const singleBox = document.getElementById('single-list');
            habitsBox.innerHTML = ''; singleBox.innerHTML = '';

            state.items.forEach(i => {
                const card = document.createElement('div');
                card.className = `task-card ${i.completed ? 'completed' : ''}`;
                card.innerHTML = `
                    <div>
                        <div class="task-title">${i.title}</div>
                        <div class="task-meta">
                            <span class="tag">⏰ ${i.time}</span>
                            ${i.type === 'single' ? `<span class="tag tag-date">📅 ${i.date}</span>` : ''}
                        </div>
                    </div>
                    <button class="checkbox-btn" onclick="toggleCheck(${i.id})">✓</button>
                `;

                if (i.type === 'habit') habitsBox.appendChild(card);
                else singleBox.appendChild(card);
            });
        }

        render();
    </script>
</body>
</html>
